<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 生日快乐</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .music-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 44px; height: 44px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.3); backdrop-filter: blur(8px);
            font-size: 1.3rem; cursor: pointer; transition: all 0.3s;
        }
        .music-btn:hover { background: rgba(255,255,255,0.5); transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="container">
        <h1>Happy Birthday 🎂</h1>
        <div class="greeting"></div>
        <button class="cta-button">点击开启惊喜 💕</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="./music/birthday.mp3" type="audio/mpeg">
    </audio>
    <button id="musicBtn" class="music-btn" title="播放/暂停">🔇</button>

    <script src="script.js"></script>
</body>
</html>
